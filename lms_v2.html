<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduForge LMS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0d12; --surface:#12151d; --surface2:#181c27; --surface3:#1e2232;
  --border:#252a3a; --border2:#2e354a;
  --accent:#5eead4; --accent-dim:rgba(94,234,212,0.12);
  --indigo:#818cf8; --pink:#f472b6; --amber:#fbbf24;
  --bronze:#cd7c3e; --silver:#94a3b8; --gold:#fbbf24; --master:#a78bfa;
  --text:#e2e8f0; --muted:#64748b; --muted2:#475569;
  --r:13px; --r-sm:9px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{font-family:'DM Sans',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'DM Sans',sans-serif;}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ══ UTILITY ══ */
.hidden{display:none!important;}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap-8{gap:8px;} .gap-12{gap:12px;}
.font-syne{font-family:'Syne',sans-serif;}
.fw-800{font-weight:800;} .fw-700{font-weight:700;} .fw-600{font-weight:600;}

/* ══════════════════════════════
   LOGIN PAGE
══════════════════════════════ */
#login-page {
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(94,234,212,0.08) 0%, transparent 70%),
              radial-gradient(ellipse 50% 40% at 80% 80%, rgba(129,140,248,0.06) 0%, transparent 60%),
              var(--bg);
  padding:20px;
}
.login-wrap {
  width:100%;max-width:440px;
  animation: fadeUp 0.5s ease;
}
.login-logo {
  text-align:center;margin-bottom:36px;
}
.login-logo .brand {
  font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  color:var(--text);letter-spacing:-1px;
}
.login-logo .brand span{color:var(--accent);}
.login-logo .tagline{color:var(--muted);font-size:0.85rem;margin-top:4px;}

.role-picker {
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;
}
.role-btn {
  padding:16px 10px;
  border-radius:var(--r);
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:0.82rem;font-weight:600;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.role-btn .role-icon{font-size:1.6rem;}
.role-btn:hover{border-color:var(--border2);color:var(--text);}
.role-btn.selected{border-color:var(--accent);background:rgba(94,234,212,0.07);color:var(--accent);}

.login-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:32px;
}
.login-title {
  font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;
  margin-bottom:24px;
}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px;}
.form-input{width:100%;padding:11px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:0.9rem;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--accent);}
textarea.form-input{resize:vertical;min-height:90px;}
select.form-input option{background:var(--surface2);}

.hint-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:20px;font-size:0.78rem;color:var(--muted);line-height:1.6;}
.hint-box strong{color:var(--accent);font-weight:600;}

.btn-login{width:100%;padding:13px;background:var(--accent);color:#0b0d12;font-weight:700;font-size:0.95rem;border:none;border-radius:var(--r-sm);transition:opacity 0.2s;margin-top:4px;}
.btn-login:hover{opacity:0.85;}

/* ══════════════════════════════
   APP SHELL
══════════════════════════════ */
#app{display:none;flex-direction:column;min-height:100vh;}

/* ── NAV ── */
nav {
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;
}
.nav-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-0.5px;}
.nav-brand span{color:var(--accent);}
.nav-center{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:4px;}
.nav-tab{padding:7px 18px;border-radius:7px;font-size:0.82rem;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all 0.18s;white-space:nowrap;}
.nav-tab.active{background:var(--accent);color:#0b0d12;}
.nav-tab:not(.active):hover{color:var(--text);}
.nav-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;font-size:0.8rem;}
.user-chip .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.72rem;color:white;flex-shrink:0;}
.logout-btn{padding:7px 14px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.78rem;font-weight:600;transition:all 0.2s;}
.logout-btn:hover{border-color:var(--pink);color:var(--pink);}

/* ── MAIN ── */
main{flex:1;overflow-y:auto;}
.page{display:none;padding:36px 32px;max-width:1180px;margin:0 auto;}
.page.active{display:block;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ══ COMMON COMPONENTS ══ */
.page-header{margin-bottom:28px;}
.page-title{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:0.9rem;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card:nth-child(1)::before{background:var(--accent);}
.stat-card:nth-child(2)::before{background:var(--indigo);}
.stat-card:nth-child(3)::before{background:var(--pink);}
.stat-card:nth-child(4)::before{background:var(--amber);}
.stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.9px;margin-bottom:7px;}
.stat-val{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;}
.stat-delta{font-size:0.75rem;color:var(--accent);margin-top:3px;}

.section-hd{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin:28px 0 14px;display:flex;align-items:center;gap:10px;}
.section-hd::after{content:'';flex:1;height:1px;background:var(--border);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;transition:border-color 0.2s,transform 0.2s;}
.card:hover{border-color:var(--border2);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:var(--r-sm);font-size:0.83rem;font-weight:600;border:none;transition:all 0.18s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#0b0d12;}
.btn-primary:hover{opacity:0.85;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border2);}
.btn-danger{background:rgba(244,114,182,0.12);color:var(--pink);border:1px solid rgba(244,114,182,0.25);}
.btn-danger:hover{background:rgba(244,114,182,0.2);}
.btn-sm{padding:6px 13px;font-size:0.77rem;}
.btn-indigo{background:rgba(129,140,248,0.15);color:var(--indigo);border:1px solid rgba(129,140,248,0.25);}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:0.7rem;font-weight:600;}
.tag-green{background:rgba(94,234,212,0.12);color:var(--accent);}
.tag-yellow{background:rgba(251,191,36,0.12);color:var(--amber);}
.tag-red{background:rgba(244,114,182,0.12);color:var(--pink);}
.tag-blue{background:rgba(129,140,248,0.12);color:var(--indigo);}

.progress-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--accent));transition:width 0.7s ease;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.9px;color:var(--muted);border-bottom:1px solid var(--border);}
td{padding:13px 16px;font-size:0.87rem;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.015);}

.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:white;flex-shrink:0;}

/* ══ BADGE SYSTEM ══ */
.badges-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 24px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);min-width:100px;position:relative;transition:transform 0.2s;}
.badge:hover{transform:translateY(-2px);}
.badge-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
.badge-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.8rem;}
.badge-req{font-size:0.68rem;color:var(--muted);}
.badge.locked{opacity:0.35;filter:grayscale(1);}
.badge.earned::after{content:'✓';position:absolute;top:7px;right:7px;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#0b0d12;font-size:0.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:17px;text-align:center;}
.badge-bronze .badge-icon{background:radial-gradient(circle at 35% 35%,#e8a06a,#a0522d);box-shadow:0 0 14px rgba(205,124,62,0.35);}
.badge-bronze{border-color:rgba(205,124,62,0.3);}
.badge-bronze .badge-name{color:var(--bronze);}
.badge-silver .badge-icon{background:radial-gradient(circle at 35% 35%,#d0d8e8,#8898aa);box-shadow:0 0 14px rgba(148,163,184,0.35);}
.badge-silver{border-color:rgba(148,163,184,0.3);}
.badge-silver .badge-name{color:var(--silver);}
.badge-gold .badge-icon{background:radial-gradient(circle at 35% 35%,#fde68a,#d97706);box-shadow:0 0 18px rgba(251,191,36,0.45);animation:goldPulse 2.5s ease-in-out infinite;}
.badge-gold{border-color:rgba(251,191,36,0.35);}
.badge-gold .badge-name{color:var(--gold);}
@keyframes goldPulse{0%,100%{box-shadow:0 0 18px rgba(251,191,36,0.45);}50%{box-shadow:0 0 32px rgba(251,191,36,0.8);}}
.badge-master .badge-icon{background:radial-gradient(circle at 35% 35%,#ddd6fe,#7c3aed);box-shadow:0 0 22px rgba(167,139,250,0.6);animation:masterPulse 2s ease-in-out infinite;}
.badge-master{border-color:rgba(167,139,250,0.45);background:linear-gradient(135deg,#12151d,#1a1530);}
.badge-master .badge-name{color:var(--master);}
@keyframes masterPulse{0%,100%{box-shadow:0 0 22px rgba(167,139,250,0.6);}50%{box-shadow:0 0 40px rgba(167,139,250,1);}}

/* ══ COURSE BROWSE CARD ══ */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform 0.2s,border-color 0.2s;}
.course-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.course-thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;}
.thumb-1{background:linear-gradient(135deg,#1e3a5f,#1e40af);}
.thumb-2{background:linear-gradient(135deg,#064e3b,#065f46);}
.thumb-3{background:linear-gradient(135deg,#831843,#9d174d);}
.thumb-4{background:linear-gradient(135deg,#312e81,#4c1d95);}
.thumb-5{background:linear-gradient(135deg,#78350f,#92400e);}
.thumb-6{background:linear-gradient(135deg,#1e293b,#334155);}
.course-body{padding:16px;}
.course-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;margin-bottom:3px;}
.course-instructor{font-size:0.75rem;color:var(--muted);margin-bottom:12px;}
.course-meta{display:flex;gap:10px;font-size:0.72rem;color:var(--muted);}

/* ══ LESSON PLAYER ══ */
.lesson-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
.lesson-video{background:var(--surface2);border-radius:var(--r);height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border);position:relative;overflow:hidden;margin-bottom:16px;}
.lesson-video::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(30,58,95,0.4),rgba(13,13,18,0.5));}
.play-btn{width:58px;height:58px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;position:relative;z-index:1;border:none;transition:transform 0.2s;}
.play-btn:hover{transform:scale(1.1);}
.lesson-list{display:flex;flex-direction:column;gap:6px;padding:14px;}
.lesson-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:transparent;border:1px solid transparent;cursor:pointer;transition:all 0.15s;font-size:0.85rem;}
.lesson-item:hover{background:var(--surface2);}
.lesson-item.active{border-color:var(--accent);background:rgba(94,234,212,0.06);}
.lesson-item.done .lesson-num{background:var(--accent);color:#0b0d12;border-color:var(--accent);}
.lesson-num{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;flex-shrink:0;}

/* ══ UPLOAD ZONE ══ */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:border-color 0.2s;margin:14px 0;}
.upload-zone:hover{border-color:var(--accent);}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;line-height:1;}
.modal-close:hover{color:var(--text);}

/* ══ TOAST ══ */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:12px 18px;border-radius:var(--r-sm);font-size:0.85rem;font-weight:600;animation:toastIn 0.3s ease,toastOut 0.3s ease 2.7s forwards;max-width:320px;}
.toast-success{background:#0f2e26;border:1px solid rgba(94,234,212,0.3);color:var(--accent);}
.toast-error{background:#2e0f1a;border:1px solid rgba(244,114,182,0.3);color:var(--pink);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}

/* ══ EMPTY STATE ══ */
.empty{text-align:center;padding:48px 24px;color:var(--muted);}
.empty .empty-icon{font-size:3rem;margin-bottom:12px;opacity:0.5;}
.empty p{font-size:0.9rem;}

/* ══ NOTIF DOT ══ */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-left:4px;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ══ WELCOME BANNER ══ */
.welcome-banner{background:linear-gradient(135deg,#151a26,#1a2035);border:1px solid var(--border);border-radius:var(--r);padding:26px 30px;margin-bottom:26px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative;}
.welcome-banner::after{content:'🎓';position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:4.5rem;opacity:0.07;pointer-events:none;}

/* ══ GRID HELPERS ══ */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}

/* ══ MISC ══ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:0.7rem;font-weight:600;background:var(--surface2);border:1px solid var(--border);}
.divider{height:1px;background:var(--border);margin:22px 0;}
.text-muted{color:var(--muted);}
.text-accent{color:var(--accent);}
.text-pink{color:var(--pink);}
.text-amber{color:var(--amber);}
.mt-4{margin-top:4px;} .mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-20{margin-top:20px;}
.mb-16{margin-bottom:16px;} .mb-20{margin-bottom:20px;}
.fs-sm{font-size:0.82rem;} .fs-xs{font-size:0.75rem;}
</style>
</head>
<body>

<!-- ████████████████████ LOGIN PAGE ████████████████████ -->
<div id="login-page">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="brand">Edu<span>Forge</span></div>
      <div class="tagline">Learning Management System</div>
    </div>

    <div style="margin-bottom:20px;">
      <div style="font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;margin-bottom:10px;">Sign in as</div>
      <div class="role-picker">
        <div class="role-btn selected" onclick="selectRole('student',this)">
          <div class="role-icon">📚</div>
          <div>Student</div>
        </div>
        <div class="role-btn" onclick="selectRole('instructor',this)">
          <div class="role-icon">🎓</div>
          <div>Instructor</div>
        </div>
        <div class="role-btn" onclick="selectRole('admin',this)">
          <div class="role-icon">🛡</div>
          <div>Admin</div>
        </div>
      </div>
    </div>

    <div class="login-card">
      <div class="login-title" id="login-title">Student Login</div>
      <div class="hint-box" id="login-hint">
        Demo: use any email · password: <strong>any</strong><br>
        Try <strong>student@edu.com</strong> / <strong>123456</strong>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" type="email" id="login-email" placeholder="you@example.com" value="student@edu.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="login-password" placeholder="••••••••" value="123456">
      </div>
      <button class="btn-login" onclick="doLogin()">Sign In →</button>
    </div>
  </div>
</div>

<!-- ████████████████████ APP SHELL ████████████████████ -->
<div id="app">
  <nav>
    <div class="nav-brand">Edu<span>Forge</span></div>
    <div class="nav-center" id="nav-tabs"></div>
    <div class="nav-right">
      <div class="user-chip" id="user-chip">
        <div class="av" id="nav-avatar"></div>
        <span id="nav-username"></span>
        <span id="nav-role-badge" class="chip" style="font-size:0.65rem;padding:2px 8px;"></span>
      </div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <main>

function selectRole(role, el) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  const titles = {student:'Student Login',instructor:'Instructor Login',admin:'Admin Login'};
  const hints = {
    student: 'Demo: <strong>student@edu.com</strong> / any password',
    instructor: 'Demo: <strong>sara@edu.com</strong> / any password',
    admin: 'Demo: <strong>admin@edu.com</strong> / any password',
  };
  const emails = {student:'student@edu.com',instructor:'sara@edu.com',admin:'admin@edu.com'};
  document.getElementById('login-title').textContent = titles[role];
  document.getElementById('login-hint').innerHTML = hints[role];
  document.getElementById('login-email').value = emails[role];
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  if(!email){toast('Please enter your email','error');return;}

  if(currentRole==='student'){
    const s = DB.students.find(s=>s.email===email)||DB.students[0];
    currentUser = {...s, role:'student'};
  } else if(currentRole==='instructor'){
    const i = DB.instructors.find(i=>i.email===email && i.status==='approved')||DB.instructors[0];
    if(DB.instructors.find(i=>i.email===email)?.status==='pending'){
      toast('Your account is pending admin approval','error');return;
    }
    currentUser = {...i, role:'instructor'};
  } else {
    currentUser = {id:0,name:'Admin User',email,role:'admin'};
  }

  document.getElementById('login-page').style.display='none';
  document.getElementById('app').style.display='flex';
  buildNav();
  showFirstPage();
  toast(`Welcome, ${currentUser.name}!`,'success');
}

function doLogout() {
  currentUser=null;
  document.getElementById('login-page').style.display='flex';
  document.getElementById('app').style.display='none';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
}

function buildNav(){
  const tabs = NAV_CONFIG[currentUser.role];
  const container = document.getElementById('nav-tabs');
  container.innerHTML = tabs.map((t,i)=>
    `<button class="nav-tab${i===0?' active':''}" onclick="navTo('${t.id}',this)">${t.label}</button>`
  ).join('');

  const av = document.getElementById('nav-avatar');
  const initials = currentUser.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const colors = {student:'linear-gradient(135deg,#1e40af,#4f46e5)',instructor:'linear-gradient(135deg,#4f46e5,#7c3aed)',admin:'linear-gradient(135deg,#be185d,#db2777)'};
  av.style.background = colors[currentUser.role];
  av.textContent = initials;
  document.getElementById('nav-username').textContent = currentUser.name.split(' ')[0];
  const rb = document.getElementById('nav-role-badge');
  rb.textContent = ROLES[currentUser.role].label;
  rb.style.color = ROLES[currentUser.role].color;
  rb.style.background = ROLES[currentUser.role].bg;
  rb.style.borderColor = 'transparent';
}

function navTo(pageId, btn){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  showPage(pageId);
}

function showFirstPage(){
  const first = NAV_CONFIG[currentUser.role][0].id;
  showPage(first);
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+id);
  if(!el)return;
  renderPage(id,el);
  el.classList.add('active');
  el.scrollTop=0;
}

function enrollCourse(id){
  const u = currentUser;
  if(u.enrolled.includes(id)){toast('Already enrolled','error');return;}
  u.enrolled.push(id);
  if(!u.progress) u.progress={};
  u.progress[id]={done:[],pct:0};
  const c = DB.courses.find(x=>x.id===id);
  c.students++;
  // also update in DB.students
  const dbS = DB.students.find(s=>s.id===u.id);
  if(dbS){dbS.enrolled.push(id);if(!dbS.progress)dbS.progress={};dbS.progress[id]={done:[],pct:0};}
  toast(`Enrolled in "${c.name}"!`,'success');
  renderPage('s-browse', document.getElementById('page-s-browse'));
  renderPage('s-home', document.getElementById('page-s-home'));
}

function openCourse(id){
  openModal('course-detail',id);
}

function markLessonDone(courseId, lessonId){
  if(!lessonId)return;
  const u = currentUser;
  if(!u.progress) u.progress={};
  if(!u.progress[courseId]) u.progress[courseId]={done:[],pct:0};
  const p = u.progress[courseId];
  if(!p.done.includes(lessonId)){
    p.done.push(lessonId);
    const c = DB.courses.find(x=>x.id===courseId);
    p.pct = Math.round((p.done.length/c.lessons.length)*100);
    // sync to DB
    const dbS = DB.students.find(s=>s.id===u.id);
    if(dbS){dbS.progress[courseId]=p;}
    u.badge = getBadge(avgProgress(u)).key;
    toast('Lesson marked complete! ✓','success');
    // re-open modal
    setTimeout(()=>openModal('course-detail',courseId),300);
  } else {
    toast('Already marked done','error');
  }
}

function createAssignment(){
  const title=document.getElementById('m-title')?.value.trim();
  const desc=document.getElementById('m-desc')?.value.trim();
  const courseId=parseInt(document.getElementById('m-course')?.value);
  const due=document.getElementById('m-due')?.value;
  const maxScore=parseInt(document.getElementById('m-score')?.value)||100;
  if(!title){toast('Please enter a title','error');return;}
  DB.assignments.push({id:DB.nextAssignmentId++,courseId,title,desc:desc||'No description',due:due||'TBD',maxScore,instructorId:currentUser.id});
  toast(`Assignment "${title}" created!`,'success');
  closeModal();
  renderPage('i-assignments',document.getElementById('page-i-assignments'));
  // Notify enrolled students (visual only)
  setTimeout(()=>toast('Students enrolled in this course were notified!','success'),600);
}

function createCourse(){
  const name=document.getElementById('m-cname')?.value.trim();
  if(!name){toast('Please enter a course name','error');return;}
  const newCourse={id:DB.courses.length+1,name,instructor:currentUser.name,instructorId:currentUser.id,thumb:`thumb-${(DB.courses.length%6)+1}`,icon:'📘',lessons:[],status:'pending',students:0};
  DB.courses.push(newCourse);
  toast(`"${name}" submitted for approval!`,'success');
  closeModal();
  renderPage('i-courses',document.getElementById('page-i-courses'));
}

function openUploadLesson(courseId){ openModal('upload-lesson',courseId); }

function uploadLesson(courseId){
  const title=document.getElementById('m-ltitle')?.value.trim();
  const dur=document.getElementById('m-ldur')?.value.trim();
  if(!title){toast('Please enter a lesson title','error');return;}
  const c=DB.courses.find(x=>x.id===courseId);
  if(!c)return;
  c.lessons.push({id:c.lessons.length+1,title,dur:dur||'?? min'});
  toast(`Lesson "${title}" uploaded!`,'success');
  closeModal();
  renderPage('i-courses',document.getElementById('page-i-courses'));
}

function gradeSubmission(subId,maxScore){ openModal('grade',{subId,maxScore}); }

function saveGrade(subId,maxScore){
  const grade=parseInt(document.getElementById('m-grade')?.value);
  if(isNaN(grade)||grade<0||grade>maxScore){toast(`Enter a valid score (0-${maxScore})`,'error');return;}
  const sub=DB.submissions.find(s=>s.id===subId);
  if(sub){sub.grade=grade;}
  toast(`Graded! Score: ${grade}/${maxScore}`,'success');
  closeModal();
  renderPage('i-submissions',document.getElementById('page-i-submissions'));
}

function submitAssignment(assignmentId){ openModal('submit-assignment',assignmentId); }

function doSubmitAssignment(assignmentId){
  const u=currentUser;
  if(DB.submissions.find(s=>s.assignmentId===assignmentId&&s.studentId===u.id)){toast('Already submitted!','error');return;}
  DB.submissions.push({id:DB.nextSubmissionId++,assignmentId,studentId:u.id,studentName:u.name,file:'submission.zip',date:'Just now',grade:null});
  toast('Assignment submitted!','success');
  closeModal();
  renderPage('s-assignments',document.getElementById('page-s-assignments'));
}

function approveInstructor(id){
  const i=DB.instructors.find(x=>x.id===id);
  if(i){i.status='approved';toast(`${i.name} approved!`,'success');renderPage('a-instructors',document.getElementById('page-a-instructors'));}
}
function rejectInstructor(id){
  const i=DB.instructors.find(x=>x.id===id);
  if(i){DB.instructors.splice(DB.instructors.indexOf(i),1);toast(`${i.name} rejected.`,'error');renderPage('a-instructors',document.getElementById('page-a-instructors'));}
}
function suspendInstructor(id){
  const i=DB.instructors.find(x=>x.id===id);
  if(i){i.status='suspended';toast(`${i.name} suspended.`,'error');renderPage('a-instructors',document.getElementById('page-a-instructors'));}
}
function approveCourse(id){
  const c=DB.courses.find(x=>x.id===id);
  if(c){c.status='approved';toast(`"${c.name}" is now live!`,'success');renderPage('a-courses',document.getElementById('page-a-courses'));}
}
function rejectCourse(id){
  const c=DB.courses.find(x=>x.id===id);
  if(c){DB.courses.splice(DB.courses.indexOf(c),1);toast(`"${c.name}" rejected.`,'error');renderPage('a-courses',document.getElementById('page-a-courses'));}
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function navToId(pageId){
  const tab = document.querySelector(`[onclick*="navTo('${pageId}'"]`)||
              [...document.querySelectorAll('.nav-tab')].find(t=>t.getAttribute('onclick')?.includes(`'${pageId}'`));
  if(tab) tab.click();
  else showPage(pageId);
}

function avgProgress(u){
  if(!u.enrolled||u.enrolled.length===0)return 0;
  const total = u.enrolled.reduce((acc,cid)=>{
    const p=u.progress?.[cid];
    return acc+(p?.pct||0);
  },0);
  return Math.round(total/u.enrolled.length);
}
function avgProgressById(s){
  if(!s.enrolled||s.enrolled.length===0)return 0;
  const total=s.enrolled.reduce((acc,cid)=>{const p=s.progress?.[cid];return acc+(p?.pct||0);},0);
  return Math.round(total/s.enrolled.length);
}
function totalLessonsDone(u){
  if(!u.progress)return 0;
  return Object.values(u.progress).reduce((acc,p)=>acc+(p?.done?.length||0),0);
}
function pendingAssignments(u){
  return DB.assignments.filter(a=>u.enrolled?.includes(a.courseId)&&!DB.submissions.find(s=>s.assignmentId===a.id&&s.studentId===u.id));
}
function getBadge(pct){
  if(pct>=100) return {name:'Master',key:'master',next:'Perfect!',icon:'👑'};
  if(pct>=90)  return {name:'Gold',  key:'gold',  next:'100% for Master',icon:'🥇'};
  if(pct>=50)  return {name:'Silver',key:'silver',next:'90% for Gold',icon:'🥈'};
  if(pct>=25)  return {name:'Bronze',key:'bronze',next:'50% for Silver',icon:'🥉'};
  return {name:'No Badge',key:'none',next:'25% for Bronze',icon:'🎯'};
}
function renderBadgesHTML(pct){
  const levels=[{key:'bronze',pct:25,icon:'🥉',label:'Bronze'},{key:'silver',pct:50,icon:'🥈',label:'Silver'},{key:'gold',pct:90,icon:'🥇',label:'Gold'},{key:'master',pct:100,icon:'👑',label:'Master'}];
  return `<div class="badges-row">${levels.map(b=>`
    <div class="badge badge-${b.key} ${pct>=b.pct?'earned':'locked'}">
      <div class="badge-icon">${b.icon}</div>
      <div class="badge-name">${b.label}</div>
      <div class="badge-req">${b.pct}% complete</div>
    </div>`).join('')}</div>`;
}
function renderEnrolledCourseCard(c,u){
  const p=u.progress?.[c.id];
  const pct=p?.pct||0;
  return `<div class="course-card" onclick="openCourse(${c.id})">
    <div class="course-thumb ${c.thumb}">${c.icon}</div>
    <div class="course-body">
      <div class="course-name">${c.name}</div>
      <div class="course-instructor">by ${c.instructor}</div>
      <div class="progress-bar" style="margin:10px 0 4px;"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted);"><span>${p?.done?.length||0}/${c.lessons.length} lessons</span><span>${pct}%</span></div>
    </div>
  </div>`;
}

function toast(msg,type='success'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),3100);
}
</script>
